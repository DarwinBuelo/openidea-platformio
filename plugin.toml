id = "openidea-darwin.openidea-platformio"
name = "PlatformIO"
version = "0.2.0"
description = "Brings PlatformIO Core into OpenIDEA: build, upload, monitor, and manage boards and libraries for embedded projects without leaving the IDE or using VS Code"
authors = ["Darwin Buelo"]
# Marketplace categories (up to 3): languages, themes, icon-themes, linters,
# vcs, ai, frameworks, tools, other.
categories = ["tools", "frameworks", "language"]
icon = "icons/platformio.svg"
engines.openidea = "^1.4"
# Built by `openidea-plugin build`. The code is loaded the first time one of
# its commands runs; the commands below show in Find Action before that.
wasm = "dist/plugin.wasm"

# What the code may do. The user approves these when installing.
[capabilities]
required = [
  "project.read",
  "project.write",
  "process:python3",
  "process:sh",
  "fs.read:~/.platformio",
  "storage",
]

[[contributes.views]]
id = "platformio"
title = "PlatformIO"
icon = "icons/platformio.svg"
# The bottom dock, whose stripe button sits at the bottom left of the window and
# whose panel spans the window's width: the most room for build and monitor output.
location = "bottom"

[[contributes.fileIcons]]
id = "platformio-ini"
patterns = ["platformio.ini"]
icon = "icons/platformio.svg"

